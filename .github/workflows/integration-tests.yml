name: Pruebas de Integración Flask con unittest


on:
  push:        
  pull_request:  

# 2️ Qué se ejecutará
jobs:
  test:
    runs-on: ubuntu-latest   

    steps:
      # 3️ Paso: Descargar tu código del repositorio
      - name:  Descargar el código
        uses: actions/checkout@v3

      # 4️ Paso: Instalar Python
      - name:  Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 5️ Paso: Instalar dependencias del proyecto
      - name:  Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
     

      # 6️ Paso: Ejecutar las pruebas
      - name: Ejecutar pruebas con unittest
        run: python -m unittest discover -s tests -p "*.py"

