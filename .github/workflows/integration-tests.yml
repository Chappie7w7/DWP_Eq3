# Nombre del workflow
name: Pruebas de Integración Flask con Pytest

# Disparadores del workflow
on:
  push:        # Se ejecuta al hacer push a cualquier rama
  pull_request:  # Se ejecuta al crear un pull request

jobs:
  test:
    runs-on: ubuntu-latest   

    steps:
      # Paso 1: Descargar el código del repositorio
      - name: Descargar el código
        uses: actions/checkout@v3

      # Paso 2: Configurar la versión de Python
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  

      # Paso 3: Instalar las dependencias del proyecto
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip  # Actualiza pip a la última versión
          pip install -r requirements.txt     # Instala las dependencias definidas en requirements.txt
          pip install pytest                  # Instala pytest si no está en requirements.txt

      # Paso 4: Ejecutar las pruebas con pytest
      - name: Ejecutar pruebas con Pytest
        run: pytest -v tests  
